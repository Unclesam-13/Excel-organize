name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path core.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build EXE + installer
        env:
          PYTHONUTF8: "1"
        run: python build.py

      - name: Smoke test packaged EXE
        env:
          PYTHONUTF8: "1"
        run: python ci/smoke_test.py dist/ExcelLibrary/ExcelLibrary.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExcelLibrary-Windows
          path: |
            dist/*.exe
            dist/*.zip

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 会计工作台 v${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            ## 下载
            - **ExcelLibrary_Setup_*.exe**：安装包，双击安装（不需要管理员权限），装好后桌面会有「会计工作台」图标
            - **ExcelLibrary_Portable_*.zip**：绿色版，解压后运行 `ExcelLibrary.exe`

            首次打开：顶部「设置」→ 填写 DeepSeek API Key → 保存并测试连接。详细说明见仓库里的「使用说明.md」。
          files: |
            dist/*.exe
            dist/*.zip
